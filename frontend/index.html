<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>News Summarizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&family=New+York:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Top Bar -->
  <header class="top-bar">
    <div class="top-bar-inner">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2" />
        </svg>
        <span>News Summarizer</span>
      </div>
      <nav class="top-nav">
        <button class="nav-btn active" data-view="feed">Feed</button>
        <button class="nav-btn" data-view="custom">Summarize</button>
      </nav>
      <div class="top-actions">
        <div class="auto-refresh-toggle">
          <label class="toggle-label" for="autoRefresh">Auto-refresh</label>
          <label class="toggle-switch">
            <input type="checkbox" id="autoRefresh" />
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>
    </div>
  </header>

  <main class="main-content">
    <!-- Feed View -->
    <section id="feedView" class="view active">
      <!-- Source Pills -->
      <div class="source-bar">
        <button class="source-pill active" data-source="all">All Sources</button>
        <button class="source-pill" data-source="bbc">BBC</button>
        <button class="source-pill" data-source="cnn">CNN</button>
        <button class="source-pill" data-source="aljazeera">Al Jazeera</button>
        <button class="source-pill" data-source="npr">NPR</button>
        <button class="source-pill" data-source="guardian">Guardian</button>
        <button class="source-pill" data-source="nytimes">NY Times</button>
      </div>

      <!-- Sentence Count Slider -->
      <div class="controls-bar">
        <div class="slider-group">
          <label for="sentenceSlider">Summary length</label>
          <input type="range" id="sentenceSlider" min="3" max="5" value="4" />
          <span id="sentenceValue" class="slider-value">4 sentences</span>
        </div>
      </div>

      <!-- Loading State -->
      <div id="loadingState" class="loading-state hidden">
        <div class="loading-spinner"></div>
        <p>Fetching and summarizing articles...</p>
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="empty-icon">
          <path d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2" />
        </svg>
        <p>No articles found. Try another source.</p>
      </div>

      <!-- Articles Grid -->
      <div id="articlesGrid" class="articles-grid"></div>
    </section>

    <!-- Custom Summarize View -->
    <section id="customView" class="view">
      <div class="custom-container">
        <h2 class="custom-title">Paste & Summarize</h2>
        <p class="custom-subtitle">Paste any article text and get an instant extractive summary.</p>
        <div class="custom-form">
          <textarea id="customText" placeholder="Paste your article text here..." rows="10"></textarea>
          <div class="custom-controls">
            <div class="slider-group">
              <label for="customSlider">Summary length</label>
              <input type="range" id="customSlider" min="3" max="5" value="4" />
              <span id="customSliderValue" class="slider-value">4 sentences</span>
            </div>
            <button id="summarizeBtn" class="btn-primary">Summarize</button>
          </div>
        </div>
        <div id="customResult" class="custom-result hidden">
          <h3>Summary</h3>
          <p id="customSummaryText"></p>
        </div>
        <div id="customLoading" class="loading-state hidden">
          <div class="loading-spinner"></div>
          <p>Generating summary...</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Refresh Timer -->
  <div id="refreshTimer" class="refresh-timer hidden">
    Next refresh in <span id="countdown">60</span>s
  </div>

  <script src="app.js"></script>
</body>
</html>
